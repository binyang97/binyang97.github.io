<!-- Scroll-to-next-tab navigation -->
<div id="snav-sentinel" style="height:1px;visibility:hidden;"></div>
<style>
  #scroll-nav-hint {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(30,30,30,0.9);
    color: #fff;
    text-align: center;
    padding: 12px 16px;
    font-size: 14px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #scroll-nav-hint.visible { transform: translateY(0); }
  #scroll-nav-hint button {
    border: 1px solid #fff;
    background: transparent;
    color: #fff;
    padding: 4px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  #scroll-nav-hint button:hover { background: rgba(255,255,255,0.2); }
  #scroll-nav-hint button.primary { background: #fff; color: #222; }
  #scroll-nav-hint button.primary:hover { background: #ddd; }
</style>
<script>
(function () {
  var baseurl = '{{ site.baseurl }}';
  var navLinks = [
    { url: baseurl + '/', title: 'Home' },
    {% for link in site.data.navigation.main %}
    { url: baseurl + '{{ link.url }}', title: '{{ link.title }}' },
    {% endfor %}
  ];

  var currentPath = window.location.pathname.replace(/\/?$/, '/');
  var homeUrl = (baseurl + '/').replace(/\/\//, '/');
  var currentIndex = 0;
  for (var i = 0; i < navLinks.length; i++) {
    var linkPath = navLinks[i].url.replace(/\/?$/, '/');
    if (currentPath === linkPath || (linkPath !== homeUrl && currentPath.startsWith(linkPath))) {
      currentIndex = i;
      break;
    }
  }

  if (currentIndex >= navLinks.length - 1) return;
  var nextPage = navLinks[currentIndex + 1];

  var hint = document.createElement('div');
  hint.id = 'scroll-nav-hint';
  hint.innerHTML =
    '<span>Jump to <strong>' + nextPage.title + '</strong>?</span>' +
    '<button class="primary" id="snav-yes">Yes</button>' +
    '<button id="snav-no">No</button>';
  document.body.appendChild(hint);

  document.getElementById('snav-yes').addEventListener('click', function () {
    window.location.href = nextPage.url;
  });
  document.getElementById('snav-no').addEventListener('click', function () {
    hint.classList.remove('visible');
    dismissed = true;
  });

  var sentinelVisible = false;
  var dismissed = false;

  var sentinel = document.getElementById('snav-sentinel');
  if (sentinel) {
    new IntersectionObserver(function (entries) {
      sentinelVisible = entries[0].isIntersecting;
      if (!sentinelVisible) { hint.classList.remove('visible'); dismissed = false; }
    }, { threshold: 0 }).observe(sentinel);
  }

  function tryShow() {
    if (sentinelVisible && !dismissed) hint.classList.add('visible');
  }

  window.addEventListener('wheel', function (e) {
    if (e.deltaY > 0) tryShow();
  }, { passive: true });

  var touchStartY = 0;
  window.addEventListener('touchstart', function (e) {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (e.touches[0].clientY < touchStartY) tryShow();
  }, { passive: true });
})();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var selectors = [
      '.archive__item',
      '.page__content p',
      '.page__content h2',
      '.page__content h3',
      '.page__content h4',
      '.page__content ul',
      '.page__content ol',
      '.page__content table',
      '.page__content blockquote',
      '.page__content figure',
    ];
    var targets = document.querySelectorAll(selectors.join(', '));
    targets.forEach(function (el) { el.classList.add('scroll-reveal'); });

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    targets.forEach(function (el) { observer.observe(el); });
  });
</script>
