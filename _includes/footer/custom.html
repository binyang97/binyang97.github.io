<!-- Scroll-to-next/prev-tab navigation -->
<script>
(function () {
  var baseurl = '{{ site.baseurl }}';
  var navLinks = [
    { url: baseurl + '/', title: 'Home' },
    {% for link in site.data.navigation.main %}
    { url: baseurl + '{{ link.url }}', title: '{{ link.title }}' },
    {% endfor %}
  ];

  var currentPath = window.location.pathname.replace(/\/?$/, '/');
  var homeUrl = (baseurl + '/').replace(/\/\//, '/');
  var currentIndex = 0;
  for (var i = 0; i < navLinks.length; i++) {
    var linkPath = navLinks[i].url.replace(/\/?$/, '/');
    if (currentPath === linkPath || (linkPath !== homeUrl && currentPath.startsWith(linkPath))) {
      currentIndex = i;
      break;
    }
  }

  var hasNext = currentIndex < navLinks.length - 1;
  var hasPrev = currentIndex > 0;
  if (!hasNext && !hasPrev) return;

  var nextPage = hasNext ? navLinks[currentIndex + 1] : null;
  var prevPage = hasPrev ? navLinks[currentIndex - 1] : null;

  var navigating = false;
  var accumDown = 0;
  var accumUp = 0;
  var THRESHOLD = 350;
  var pageReady = false;

  setTimeout(function () { pageReady = true; }, 1000);

  // bottom bar (next)
  var barBottom = document.createElement('div');
  barBottom.style.cssText = 'position:fixed;bottom:0;left:0;height:3px;width:0%;background:#4a90d9;z-index:9999;pointer-events:none;opacity:0;transition:width 0.08s linear,opacity 0.2s ease';
  document.body.appendChild(barBottom);

  // top bar (prev) — placed below masthead
  var barTop = document.createElement('div');
  barTop.style.cssText = 'position:fixed;top:66px;right:0;height:3px;width:0%;background:#4a90d9;z-index:9999;pointer-events:none;opacity:0;transition:width 0.08s linear,opacity 0.2s ease';
  document.body.appendChild(barTop);

  function setProgressDown(frac) {
    barBottom.style.opacity = frac > 0 ? '1' : '0';
    barBottom.style.width = Math.min(frac * 100, 100) + '%';
  }
  function setProgressUp(frac) {
    barTop.style.opacity = frac > 0 ? '1' : '0';
    barTop.style.width = Math.min(frac * 100, 100) + '%';
  }

  function doNavigate(page) {
    navigating = true;
    setProgressDown(0);
    setProgressUp(0);
    var main = document.getElementById('main');
    if (main) {
      document.body.classList.add('page-leaving');
      var done = false;
      function go() { if (!done) { done = true; window.location.href = page.url; } }
      main.addEventListener('animationend', go, { once: true });
      setTimeout(go, 750);
    } else {
      window.location.href = page.url;
    }
  }

  var scrollEl = document.scrollingElement || document.documentElement;

  window.addEventListener('wheel', function (e) {
    if (!pageReady || navigating) return;
    var delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 500 : e.deltaY;
    var atBottom = scrollEl.scrollTop + window.innerHeight >= scrollEl.scrollHeight - 80;
    var atTop = scrollEl.scrollTop <= 10;

    if (delta > 0) {
      accumUp = 0;
      setProgressUp(0);
      if (hasNext && atBottom) {
        accumDown += delta;
        setProgressDown(accumDown / THRESHOLD);
        if (accumDown >= THRESHOLD) doNavigate(nextPage);
      }
    } else if (delta < 0) {
      accumDown = 0;
      setProgressDown(0);
      if (hasPrev && atTop) {
        accumUp += Math.abs(delta);
        setProgressUp(accumUp / THRESHOLD);
        if (accumUp >= THRESHOLD) doNavigate(prevPage);
      } else {
        accumUp = 0;
        setProgressUp(0);
      }
    }
  }, { passive: true });

  var touchStartY = 0;
  window.addEventListener('touchstart', function (e) {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (!pageReady || navigating) return;
    var atBottom = scrollEl.scrollTop + window.innerHeight >= scrollEl.scrollHeight - 80;
    var atTop = scrollEl.scrollTop <= 0;
    var dy = e.touches[0].clientY - touchStartY;
    if (hasNext && atBottom && dy < -60) doNavigate(nextPage);
    if (hasPrev && atTop && dy > 60) doNavigate(prevPage);
  }, { passive: true });
})();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var selectors = [
      '.archive__item',
      '.page__content p',
      '.page__content h2',
      '.page__content h3',
      '.page__content h4',
      '.page__content ul',
      '.page__content ol',
      '.page__content table',
      '.page__content blockquote',
      '.page__content figure',
    ];
    var targets = document.querySelectorAll(selectors.join(', '));
    targets.forEach(function (el) { el.classList.add('scroll-reveal'); });

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    targets.forEach(function (el) { observer.observe(el); });

    document.querySelectorAll('.archive__item p').forEach(function (p) {
      p.innerHTML = p.innerHTML.replace(/\bB\. Yang\b/g, '<strong>B. Yang</strong>');
    });
  });
</script>
