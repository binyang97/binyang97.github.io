<!-- Support for MatJax -->
<script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>

<!-- Support for Mermaid -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>

<!-- Scroll-to-next-tab navigation -->
<div id="snav-sentinel" style="height:1px;visibility:hidden;"></div>
<style>
  #scroll-nav-hint {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(30,30,30,0.85);
    color: #fff;
    text-align: center;
    padding: 10px 16px;
    font-size: 14px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 9999;
    pointer-events: none;
  }
  #scroll-nav-hint.visible { transform: translateY(0); }
  #scroll-nav-hint .progress-bar {
    height: 3px;
    background: #fff;
    width: 0;
    margin-top: 6px;
    border-radius: 2px;
  }
  #scroll-nav-hint.visible .progress-bar {
    animation: snav-fill 1.2s linear forwards;
  }
  @keyframes snav-fill { from { width: 0; } to { width: 100%; } }
</style>
<script>
(function () {
  var baseurl = '{{ site.baseurl }}';
  var navLinks = [
    { url: baseurl + '/', title: 'Home' },
    {% for link in site.data.navigation.main %}
    { url: baseurl + '{{ link.url }}', title: '{{ link.title }}' },
    {% endfor %}
  ];

  var currentPath = window.location.pathname.replace(/\/?$/, '/');
  var homeUrl = (baseurl + '/').replace(/\/\//, '/');
  var currentIndex = 0;
  for (var i = 0; i < navLinks.length; i++) {
    var linkPath = navLinks[i].url.replace(/\/?$/, '/');
    if (currentPath === linkPath || (linkPath !== homeUrl && currentPath.startsWith(linkPath))) {
      currentIndex = i;
      break;
    }
  }

  if (currentIndex >= navLinks.length - 1) return;
  var nextPage = navLinks[currentIndex + 1];

  var hint = document.createElement('div');
  hint.id = 'scroll-nav-hint';
  hint.innerHTML = 'Next: <strong>' + nextPage.title + '</strong>&nbsp;&darr;<div class="progress-bar"></div>';
  document.body.appendChild(hint);

  var HOLD_MS = 1200;
  var holdTimer = null;
  var navigating = false;
  var sentinelVisible = false;

  function startNav() {
    if (navigating) return;
    hint.classList.add('visible');
    if (!holdTimer) {
      holdTimer = setTimeout(function () {
        navigating = true;
        window.location.href = nextPage.url;
      }, HOLD_MS);
    }
  }

  function cancelNav() {
    hint.classList.remove('visible');
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  }

  var sentinel = document.getElementById('snav-sentinel');
  if (sentinel) {
    new IntersectionObserver(function (entries) {
      sentinelVisible = entries[0].isIntersecting;
      if (!sentinelVisible) cancelNav();
    }, { threshold: 0 }).observe(sentinel);
  }

  // trigger only on active downward scroll gesture
  window.addEventListener('wheel', function (e) {
    if (e.deltaY > 0 && sentinelVisible) startNav();
  }, { passive: true });

  var touchStartY = 0;
  window.addEventListener('touchstart', function (e) {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (e.touches[0].clientY < touchStartY && sentinelVisible) startNav();
  }, { passive: true });
})();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var selectors = [
      '.archive__item',
      '.page__content p',
      '.page__content h2',
      '.page__content h3',
      '.page__content h4',
      '.page__content ul',
      '.page__content ol',
      '.page__content table',
      '.page__content blockquote',
      '.page__content figure',
    ];
    var targets = document.querySelectorAll(selectors.join(', '));
    targets.forEach(function (el) { el.classList.add('scroll-reveal'); });

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    targets.forEach(function (el) { observer.observe(el); });
  });
</script>
