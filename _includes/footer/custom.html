<!-- Scroll-to-next-tab navigation -->
<style>
  #scroll-nav-hint {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(30,30,30,0.85);
    color: #fff;
    text-align: center;
    padding: 10px 16px;
    font-size: 14px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 9999;
    pointer-events: none;
  }
  #scroll-nav-hint.visible { transform: translateY(0); }
  #scroll-nav-hint .progress-bar {
    height: 3px;
    background: #fff;
    width: 0%;
    transition: width 0.1s linear;
    margin-top: 6px;
    border-radius: 2px;
  }
</style>
<script>
(function () {
  {% include base_path %}
  var navLinks = [
    { url: base_path + '/', title: 'Home' },
    {% for link in site.data.navigation.main %}
    { url: base_path + '{{ link.url }}', title: '{{ link.title }}' },
    {% endfor %}
  ];

  var currentPath = window.location.pathname.replace(/\/?$/, '/');
  var currentIndex = 0;
  for (var i = 0; i < navLinks.length; i++) {
    var linkPath = navLinks[i].url.replace(/\/?$/, '/');
    if (currentPath === linkPath || (linkPath !== base_path + '/' && currentPath.startsWith(linkPath))) {
      currentIndex = i;
      break;
    }
  }

  if (currentIndex >= navLinks.length - 1) return;
  var nextPage = navLinks[currentIndex + 1];

  var hint = document.createElement('div');
  hint.id = 'scroll-nav-hint';
  hint.innerHTML = 'Next: <strong>' + nextPage.title + '</strong> &nbsp;↓<div class="progress-bar" id="snav-bar"></div>';
  document.body.appendChild(hint);
  var bar = document.getElementById('snav-bar');

  var TRIGGER_THRESHOLD = 80;
  var HOLD_MS = 1200;
  var holdTimer = null;
  var navigating = false;

  window.addEventListener('scroll', function () {
    if (navigating) return;
    var distFromBottom = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;

    if (distFromBottom <= TRIGGER_THRESHOLD) {
      hint.classList.add('visible');
      var progress = Math.max(0, 1 - distFromBottom / TRIGGER_THRESHOLD);
      bar.style.width = (progress * 100) + '%';

      if (!holdTimer) {
        holdTimer = setTimeout(function () {
          navigating = true;
          window.location.href = nextPage.url;
        }, HOLD_MS);
      }
    } else {
      hint.classList.remove('visible');
      bar.style.width = '0%';
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    }
  });
})();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var selectors = [
      '.archive__item',
      '.page__content > p',
      '.page__content > h2',
      '.page__content > h3',
      '.page__content > h4',
      '.page__content > ul',
      '.page__content > ol',
      '.page__content > table',
      '.page__content > blockquote',
      '.page__content > figure',
    ];
    var targets = document.querySelectorAll(selectors.join(', '));
    targets.forEach(function (el) { el.classList.add('scroll-reveal'); });

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    targets.forEach(function (el) { observer.observe(el); });
  });
</script>
