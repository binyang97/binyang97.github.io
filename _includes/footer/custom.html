<!-- Scroll-to-next-tab navigation -->
<script>
(function () {
  var baseurl = '{{ site.baseurl }}';
  var navLinks = [
    { url: baseurl + '/', title: 'Home' },
    {% for link in site.data.navigation.main %}
    { url: baseurl + '{{ link.url }}', title: '{{ link.title }}' },
    {% endfor %}
  ];

  var currentPath = window.location.pathname.replace(/\/?$/, '/');
  var homeUrl = (baseurl + '/').replace(/\/\//, '/');
  var currentIndex = 0;
  for (var i = 0; i < navLinks.length; i++) {
    var linkPath = navLinks[i].url.replace(/\/?$/, '/');
    if (currentPath === linkPath || (linkPath !== homeUrl && currentPath.startsWith(linkPath))) {
      currentIndex = i;
      break;
    }
  }

  if (currentIndex >= navLinks.length - 1) return;
  var nextPage = navLinks[currentIndex + 1];

  var navigating = false;
  var accumDelta = 0;
  var THRESHOLD = 350;
  var pageReady = false;

  setTimeout(function () { pageReady = true; }, 1000);

  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;bottom:0;left:0;height:3px;width:0%;background:#4a90d9;z-index:9999;pointer-events:none;opacity:0;transition:width 0.08s linear,opacity 0.2s ease';
  document.body.appendChild(bar);

  function setProgress(frac) {
    bar.style.opacity = frac > 0 ? '1' : '0';
    bar.style.width = Math.min(frac * 100, 100) + '%';
  }

  function doNavigate() {
    navigating = true;
    setProgress(0);
    var main = document.getElementById('main');
    if (main) {
      document.body.classList.add('page-leaving');
      var done = false;
      function go() { if (!done) { done = true; window.location.href = nextPage.url; } }
      main.addEventListener('animationend', go, { once: true });
      setTimeout(go, 750);
    } else {
      window.location.href = nextPage.url;
    }
  }

  var scrollEl = document.scrollingElement || document.documentElement;

  window.addEventListener('wheel', function (e) {
    if (!pageReady || navigating) return;
    var atBottom = scrollEl.scrollTop + window.innerHeight >= scrollEl.scrollHeight - 80;
    var delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 500 : e.deltaY;
    if (delta > 0) {
      if (atBottom) {
        accumDelta += delta;
        setProgress(accumDelta / THRESHOLD);
        if (accumDelta >= THRESHOLD) doNavigate();
      }
    } else if (delta < 0) {
      accumDelta = 0;
      setProgress(0);
    }
  }, { passive: true });

  var touchStartY = 0;
  window.addEventListener('touchstart', function (e) {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (!pageReady || navigating) return;
    var atBottom = scrollEl.scrollTop + window.innerHeight >= scrollEl.scrollHeight - 80;
    if (atBottom && e.touches[0].clientY < touchStartY - 60) doNavigate();
  }, { passive: true });
})();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var selectors = [
      '.archive__item',
      '.page__content p',
      '.page__content h2',
      '.page__content h3',
      '.page__content h4',
      '.page__content ul',
      '.page__content ol',
      '.page__content table',
      '.page__content blockquote',
      '.page__content figure',
    ];
    var targets = document.querySelectorAll(selectors.join(', '));
    targets.forEach(function (el) { el.classList.add('scroll-reveal'); });

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    targets.forEach(function (el) { observer.observe(el); });
  });
</script>
