---
layout: archive
permalink: /year-archive/
title: "Life"
author_profile: true
---

{% include base_path %}

{% for section in site.data.life.sections %}
<div class="life-section">
  <h2 class="life-section-title">{{ section.title }}</h2>
  <div class="life-grid">
    {% for entry in section.entries %}
    <div class="life-card">
      <div class="life-img-wrap">
        <img src="{{ entry.image }}" alt="{{ entry.caption }}" loading="lazy" />
      </div>
      <p class="life-caption">{{ entry.caption }}</p>
    </div>
    {% endfor %}
  </div>
</div>
{% endfor %}
